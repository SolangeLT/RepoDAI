<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
    <!-- Campo de texto -->
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"><br><br>

    <!-- Campo de email -->
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" placeholder="tu@email.com"><br><br>

    <!-- Selección -->
    <label for="pais">País:</label>
    <select id="pais" name="pais">
        <option value="">Selecciona un país</option>
        <option value="mx">México</option>
        <option value="us">Estados Unidos</option>
        <option value="es">España</option>
    </select><br><br>

    <!-- Área de texto -->
    <label for="comentarios">Comentarios:</label>
    <textarea id="comentarios" name="comentarios" rows="4" cols="30" placeholder="Escribe aquí tus comentarios"></textarea><br><br>

    <!-- Botón de envío -->
    <button type="submit">Enviar</button>
</form>
<style>
</style>
</body>
</html>
