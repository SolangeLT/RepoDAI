<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes</title>
</head>
<body>

    <h1>Solicitudes de adpoción</h1> 

    <div id=solicitudes>
    </div>

    <h2>Alta solicitudes</h2>

    <form onsubmit="enviarSolicitud(event, this)">
        
        <h3>Nombre: </h3>
        <input type="text" name="nombrePersona">
        <h3>Mascota deseada: </h3>
        <input type="text" name="mascotaDeseada">
        <h3>Motivo: </h3>
        <input type="text" name="motivo">
        <button type="submit">Enviar solicitud</button>
    </form>
    
    <script>
        function leerSolicitudesDeAdopcion() {
            const url_base = "https://repodai.onrender.com";
            const url_completa = url_base + "/solicitudes";

            fetch(url_completa)
                .then((response) => response.json())
                .then((data) => {
            console.log(data);
           
            const SolicitudesDiv = document.getElementById("solicitudes");
            SolicitudesDiv.textContent = JSON.stringify(data);
          })
          .catch((error) => console.error("Error:", error));
        }

        leerSolicitudesDeAdopcion();

       async function enviarSolicitud(event, form){
    event.preventDefault();

    // Convertir los datos del formulario en objeto
    const data = Object.fromEntries(new FormData(form));

    try {
        const response = await fetch("https://repodai.onrender.com/solicitudes", {
            method: "POST", // tipo de petición
            headers: {
                "Content-Type": "application/json" // indicar que mandamos JSON
            },
            body: JSON.stringify(data) // convertir objeto a JSON
        });

        if (!response.ok) {
            throw new Error("Error en la solicitud: " + response.status);
        }

        const result = await response.json();

        // Mostrar el resultado en la página de forma bonita
        const contenedor = document.getElementById("solicitudes");
        contenedor.innerHTML = `
            <h3>Solicitud enviada correctamente</h3>
            <p>ID: ${result.nombrePersona}</p>
            <p>Nombre: ${result.mascotaDeseada}</p>
            <p>Tipo: ${result.motivo}</p>
        `;
    } catch (error) {
        console.error("Error:", error);
        const contenedor = document.getElementById("solicitudes");
        contenedor.innerHTML = `<p style="color:red;">Hubo un error al enviar la solicitud</p>`;
    }
}

    </script>
</body>
</html>
