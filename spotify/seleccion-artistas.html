<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>seleccion-artistas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-4">
    <h1 class="mb-4">Consulta de canciones</h1>

    <div id="alerta"></div>

    <div class="mb-4">
      <label for="tokenInput" class="form-label">Token de Spotify</label>
      <input type="text" id="tokenInput" class="form-control" placeholder="Pega aquí tu token">
      <button id="guardarTokenBtn" class="btn btn-primary mt-2">Guardar token</button>
    </div>

    <div class="mb-4">
      <label for="trackSelect" class="form-label">Selecciona una canción</label>
      <select id="trackSelect" class="form-select">
        <option value="">Selecciona una canción</option>
        <option value="6HU7h9RYOaPRFeh0R3UeAr">deja vu</option>
        <option value="6De0lHrwBfPfrhorm9q1Xl">me reúso</option>
        <option value="2lTm559tuIvatlT1u0JYG2">baile inolvidable</option>
        <option value="0qaWEvPkts34WF68r8Dzx9">bailarina</option>
      </select>
    </div>

    <div class="mb-4">
      <button id="limpiarBtn" class="btn btn-secondary">Limpiar página</button>
    </div>

    <div id="resultado" class="border p-3"></div>
  </div>

  <script>
    const tokenInput = document.getElementById("tokenInput");
    const guardarTokenBtn = document.getElementById("guardarTokenBtn");
    const trackSelect = document.getElementById("trackSelect");
    const resultado = document.getElementById("resultado");
    const alerta = document.getElementById("alerta");
    const limpiarBtn = document.getElementById("limpiarBtn");

    guardarTokenBtn.addEventListener("click", function () {
      const token = tokenInput.value.trim();

      if (token === "") {
        mostrarError("Debes escribir un token antes de guardarlo.");
        return;
      }

      sessionStorage.setItem("spotifyToken", token);
      alerta.innerHTML = '<div class="alert alert-success">Token guardado en sessionStorage.</div>';
      tokenInput.value = "";
    });

    trackSelect.addEventListener("change", function () {
      const trackId = trackSelect.value;

      if (trackId === "") {
        resultado.innerHTML = "";
        return;
      }

      const tokenGuardado = sessionStorage.getItem("spotifyToken");

      if (!tokenGuardado) {
        mostrarError("No hay token guardado en sessionStorage.");
        return;
      }

      const tokenCompleto = "Bearer " + tokenGuardado;

      fetch("https://api.spotify.com/v1/tracks/" + trackId, {
        method: "GET",
        headers: {
          Authorization: tokenCompleto
        }
      })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Error en la llamada a la API");
        }
        return response.json();
      })
      .then(function (data) {
        mostrarTrack(data);
        alerta.innerHTML = "";
      })
      .catch(function () {
        mostrarError("Hubo un error al consultar la API de Spotify.");
      });
    });

    limpiarBtn.addEventListener("click", function () {
      tokenInput.value = "";
      trackSelect.value = "";
      resultado.innerHTML = "";
      alerta.innerHTML = "";
    });

    function mostrarTrack(track) {
      let artistasHtml = "";

      for (let i = 0; i < track.artists.length; i++) {
        artistasHtml += construirArtista(track.artists[i]);
      }

      resultado.innerHTML = `
        <h3>Resultado del track</h3>
        <p><strong>Tipo de álbum:</strong> ${track.album.album_type}</p>
        <p><strong>Total de canciones del álbum:</strong> ${track.album.total_tracks}</p>
        <p><strong>Nombre del álbum:</strong> ${track.album.name}</p>
        <p><strong>Artistas:</strong></p>
        ${artistasHtml}
      `;
    }

    function construirArtista(artista) {
      return `
        <div class="mb-2">
          <p class="mb-1"><strong>Nombre:</strong> ${artista.name}</p>
          <p class="mb-1">
            <strong>Spotify:</strong>
            <a href="${artista.external_urls.spotify}" target="_blank">
              ${artista.external_urls.spotify}
            </a>
          </p>
        </div>
      `;
    }

    function mostrarError(mensaje) {
      alerta.innerHTML = `
        <div class="alert alert-danger" role="alert">
          ${mensaje}
        </div>
      `;
    }
  </script>

</body>
</html>
